<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mochi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      pointer-events: none;
    }
    #pet-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }
    #pet-canvas.interactive {
      pointer-events: auto;
    }
    canvas {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="pet-canvas"></div>
  <script src="./pet-bundle.js"></script>
</body>
</html>
