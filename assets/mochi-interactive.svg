<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E87042" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) {
      .card-box { fill: #24201F !important; stroke: #3A3230 !important; }
      .card-lbl { fill: #FFE2D4 !important; }
      .card-desc { fill: #A8958E !important; }
    }

    @keyframes zzzFloat {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(12px, -24px) scale(1.1); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @keyframes laserDotPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    @keyframes pounceCrouch {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      40% { transform: translateY(4px) rotate(-3deg); }
      60% { transform: translateY(-8px) rotate(5deg); }
      80% { transform: translateY(0px) rotate(0deg); }
    }

    .zzz-1 { animation: zzzFloat 2.8s ease-out infinite; }
    .zzz-2 { animation: zzzFloat 2.8s ease-out infinite 0.9s; }
    .heart-anim { transform-origin: 450px 75px; animation: heartBeat 1.4s ease-in-out infinite; }
    .laser-dot { transform-origin: 790px 115px; animation: laserDotPulse 1s ease-in-out infinite; }
    .pouncer { transform-origin: 730px 105px; animation: pounceCrouch 2.5s ease-in-out infinite; }
  </style>

  <!-- 3 Interactive Feature Bento Cards -->

  <!-- Card 1: Sleep & Work Mode -->
  <g transform="translate(15, 10)">
    <rect class="card-box" x="0" y="0" width="270" height="155" rx="16" fill="#FFFFFF" stroke="#F0E0D6" stroke-width="1.5" />
    <text class="card-lbl" x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3D2E2B">💤 Cozy Work Mode</text>
    <text class="card-desc" x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#7C6B66">Naps quietly while you write code</text>
    
    <!-- Sleeping Cat Illustration -->
    <g transform="translate(135, 105)">
      <ellipse cx="0" cy="0" rx="36" ry="22" fill="#FFF8F0" stroke="#F0E0D6" stroke-width="1" />
      <path d="M -16 -18 Q 0 -22 10 -10 Q 12 0 -2 -2 Z" fill="#E8834A" />
      <circle cx="-22" cy="-4" r="15" fill="#FFF8F0" />
      <polygon points="-30,-12 -34,-24 -24,-18" fill="#FFF8F0" />
      <polygon points="-30,-14 -32,-21 -25,-18" fill="#FFB0C8" />
      <path d="M -26 -2 Q -22 2 -18 -2" fill="none" stroke="#665550" stroke-width="1.4" stroke-linecap="round" />
      <!-- Tail curled -->
      <path d="M 30 -4 Q 42 12 24 18 Q 8 20 0 16" fill="none" stroke="#FFF8F0" stroke-width="7" stroke-linecap="round" />
      <!-- ZZZ animations -->
      <g transform="translate(10, -25)">
        <text class="zzz-1" x="0" y="0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8877AA">z</text>
        <text class="zzz-2" x="12" y="-12" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8877AA">Z</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Mouse Tracking & Petting -->
  <g transform="translate(315, 10)">
    <rect class="card-box" x="0" y="0" width="270" height="155" rx="16" fill="#FFFFFF" stroke="#F0E0D6" stroke-width="1.5" />
    <text class="card-lbl" x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3D2E2B">💖 Real Petting &amp; Purrs</text>
    <text class="card-desc" x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#7C6B66">Stroke with cursor for gentle reactions</text>

    <!-- Affectionate Cat Illustration -->
    <g transform="translate(135, 105)">
      <ellipse cx="0" cy="5" rx="28" ry="18" fill="#FFF8F0" />
      <circle cx="0" cy="-14" r="18" fill="#FFF8F0" />
      <polygon points="-12,-24 -18,-36 -4,-28" fill="#FFF8F0" />
      <polygon points="4,-28 18,-36 12,-24" fill="#E8834A" />
      <!-- Happy squinting eyes -->
      <path d="M -9 -14 Q -5 -18 -1 -14" fill="none" stroke="#4A3B35" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 1 -14 Q 5 -18 9 -14" fill="none" stroke="#4A3B35" stroke-width="1.8" stroke-linecap="round" />
      <!-- Heart icon -->
      <g class="heart-anim">
        <path d="M 0 -36 C -5 -42 -12 -38 -12 -32 C -12 -25 0 -17 0 -17 C 0 -17 12 -25 12 -32 C 12 -38 5 -42 0 -36 Z" fill="#FF5588" filter="url(#glow)" />
      </g>
    </g>
  </g>

  <!-- Card 3: Toys & Pouncing -->
  <g transform="translate(615, 10)">
    <rect class="card-box" x="0" y="0" width="270" height="155" rx="16" fill="#FFFFFF" stroke="#F0E0D6" stroke-width="1.5" />
    <text class="card-lbl" x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3D2E2B">🎾 Toys &amp; Physics</text>
    <text class="card-desc" x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#7C6B66">Pounces on balls, yarn, &amp; laser dots</text>

    <!-- Pouncing Cat -->
    <g class="pouncer" transform="translate(100, 105)">
      <ellipse cx="0" cy="0" rx="26" ry="16" fill="#FFF8F0" />
      <circle cx="16" cy="-8" r="16" fill="#FFF8F0" />
      <polygon points="10,-18 16,-30 24,-20" fill="#E8834A" />
      <!-- Focused hunting eye -->
      <circle cx="18" cy="-8" r="4.5" fill="#4A9FE8" />
      <circle cx="19" cy="-8" r="2" fill="#111" />
      <!-- Laser dot target -->
      <circle class="laser-dot" cx="80" cy="5" r="5" fill="#FF0033" filter="url(#glow)" />
    </g>
  </g>
</svg>
