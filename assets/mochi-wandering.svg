<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F5" />
      <stop offset="50%" stop-color="#FFF3EB" />
      <stop offset="100%" stop-color="#FFEBE0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#804020" flood-opacity="0.12" />
    </filter>

    <filter id="catShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#552211" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    /* Dark mode adaptability */
    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #1E1B1A !important; stroke: #3A3230 !important; }
      .grid-line { stroke: #2A2422 !important; }
      .floor-line { stroke: #4A3E3B !important; }
      .header-text { fill: #FFE2D4 !important; }
      .sub-text { fill: #B8A29A !important; }
      .yarn-ball { filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)) !important; }
      .bubble-bg { fill: #2C2422 !important; stroke: #4A3C38 !important; }
      .bubble-text { fill: #FFAA88 !important; }
    }

    /* Cat wandering animation across the screen */
    @keyframes catWander {
      0% {
        transform: translate(60px, 120px) scaleX(1);
      }
      38% {
        transform: translate(460px, 120px) scaleX(1);
      }
      44% {
        transform: translate(460px, 120px) scaleX(1);
      }
      49% {
        transform: translate(460px, 120px) scaleX(-1);
      }
      53% {
        transform: translate(460px, 120px) scaleX(-1);
      }
      90% {
        transform: translate(80px, 120px) scaleX(-1);
      }
      96% {
        transform: translate(80px, 120px) scaleX(-1);
      }
      100% {
        transform: translate(60px, 120px) scaleX(1);
      }
    }

    /* Bobbing motion while walking */
    @keyframes bodyBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    /* Legs walking animation */
    @keyframes frontLegWalk {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(16deg); }
    }

    @keyframes backLegWalk {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-16deg); }
    }

    /* Tail swaying */
    @keyframes tailSway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(18deg); }
    }

    /* Blinking eyes */
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    /* Ears twitching */
    @keyframes earTwitch {
      0%, 88%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-6deg); }
      95% { transform: rotate(4deg); }
    }

    /* Thought bubbles fading in and out */
    @keyframes bubbleFade1 {
      0%, 35%, 100% { opacity: 0; transform: translateY(5px); }
      8%, 28% { opacity: 1; transform: translateY(0px); }
    }

    @keyframes bubbleFade2 {
      0%, 40%, 85%, 100% { opacity: 0; transform: translateY(5px); }
      52%, 75% { opacity: 1; transform: translateY(0px); }
    }

    /* Yarn ball rolling */
    @keyframes rollYarn {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .cat-wander-group {
      animation: catWander 16s ease-in-out infinite;
    }
    .cat-body-group {
      animation: bodyBob 0.5s ease-in-out infinite;
    }
    .front-leg {
      transform-origin: 0px 0px;
      animation: frontLegWalk 0.5s ease-in-out infinite;
    }
    .back-leg {
      transform-origin: 0px 0px;
      animation: backLegWalk 0.5s ease-in-out infinite;
    }
    .cat-tail {
      transform-origin: -14px -18px;
      animation: tailSway 1.8s ease-in-out infinite;
    }
    .cat-eye {
      transform-origin: 0px 0px;
      animation: eyeBlink 4s ease-in-out infinite;
    }
    .cat-ears {
      transform-origin: 0px -40px;
      animation: earTwitch 3s ease-in-out infinite;
    }
    .thought-1 {
      animation: bubbleFade1 16s ease-in-out infinite;
    }
    .thought-2 {
      animation: bubbleFade2 16s ease-in-out infinite;
    }
    .spinning-yarn {
      transform-origin: 530px 175px;
      animation: rollYarn 3s linear infinite;
    }
  </style>

  <!-- Background Base Container -->
  <rect class="bg-rect" x="8" y="8" width="884" height="224" rx="20" fill="url(#bgGrad)" stroke="#F0DDD2" stroke-width="2" filter="url(#shadow)" />

  <!-- Subtle grid pattern -->
  <g class="grid-line" stroke="#EED8CC" stroke-width="1" opacity="0.4" stroke-dasharray="4,8">
    <line x1="20" y1="50" x2="880" y2="50" />
    <line x1="20" y1="100" x2="880" y2="100" />
    <line x1="20" y1="150" x2="880" y2="150" />
  </g>

  <!-- Title / Tagline overlay -->
  <g transform="translate(48, 48)">
    <text class="header-text" x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#3D2E2B" letter-spacing="-0.5">
      Mochi — Your Desktop Cat Companion 🐾
    </text>
    <text class="sub-text" x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#886E66">
      Living, wandering, pouncing, purring 2D companion for Windows 10 &amp; 11
    </text>
  </g>

  <!-- Floor Walking Line with Paw Prints -->
  <g class="floor-line" stroke="#E0C8BA" stroke-width="2" stroke-dasharray="6,8" opacity="0.6">
    <line x1="60" y1="188" x2="840" y2="188" />
  </g>

  <!-- Interactive Toy: Yarn Ball at right side -->
  <g class="spinning-yarn" filter="url(#catShadow)">
    <circle cx="530" cy="175" r="14" fill="#FF6B6B" />
    <circle cx="530" cy="175" r="13" fill="none" stroke="#FFA3A3" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 522 170 Q 530 162 538 170 Q 546 178 538 184" fill="none" stroke="#FFD1D1" stroke-width="2" />
    <!-- Trailing loose yarn string -->
    <path d="M 544 175 Q 560 185 580 183 Q 595 180 610 185" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Little Cardboard Box on the Far Right -->
  <g transform="translate(710, 145)" filter="url(#catShadow)">
    <rect x="0" y="0" width="56" height="42" rx="4" fill="#D2A679" stroke="#B88A58" stroke-width="2" />
    <!-- Box Flaps -->
    <polygon points="-4,-6 26,-2 22,0 0,0" fill="#E0BC94" stroke="#B88A58" stroke-width="1.5" />
    <polygon points="58,-6 30,-2 34,0 56,0" fill="#C99863" stroke="#B88A58" stroke-width="1.5" />
    <text x="28" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7D552B" text-anchor="middle">MOCHI</text>
  </g>

  <!-- ============================================== -->
  <!-- ANIMATED WANDERING MOCHI CAT                   -->
  <!-- ============================================== -->
  <g class="cat-wander-group">

    <!-- Speech / Thought Bubble 1 -->
    <g class="thought-1" transform="translate(15, -45)">
      <rect class="bubble-bg" x="-10" y="-22" width="105" height="26" rx="13" fill="#FFFFFF" stroke="#F0DDD2" stroke-width="1.5" filter="url(#shadow)" />
      <polygon points="12,4 18,10 24,4" fill="#FFFFFF" class="bubble-bg" />
      <text class="bubble-text" x="42" y="-5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E87042" text-anchor="middle">
        purr purr... ✨
      </text>
    </g>

    <!-- Speech / Thought Bubble 2 -->
    <g class="thought-2" transform="translate(-10, -45)">
      <rect class="bubble-bg" x="-15" y="-22" width="125" height="26" rx="13" fill="#FFFFFF" stroke="#F0DDD2" stroke-width="1.5" filter="url(#shadow)" />
      <polygon points="20,4 26,10 32,4" fill="#FFFFFF" class="bubble-bg" />
      <text class="bubble-text" x="47" y="-5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E87042" text-anchor="middle">
        exploring desktop! 🐾
      </text>
    </g>

    <!-- Kitten Rig -->
    <g class="cat-body-group" filter="url(#catShadow)">

      <!-- Fluffy Tail -->
      <g class="cat-tail">
        <path d="M -14 -18 Q -38 -28 -28 -52" fill="none" stroke="#FFF8F0" stroke-width="11" stroke-linecap="round" />
        <!-- Orange patch on tail tip -->
        <circle cx="-28" cy="-52" r="7" fill="#E8834A" />
        <circle cx="-28" cy="-52" r="4" fill="#FFA366" />
      </g>

      <!-- Back Legs -->
      <g transform="translate(-10, 10)">
        <g class="back-leg">
          <rect x="-4" y="0" width="8" height="18" rx="4" fill="#F2E6DC" />
          <ellipse cx="0" cy="18" rx="6" ry="4" fill="#FFF8F0" />
        </g>
      </g>
      <g transform="translate(10, 10)">
        <g class="front-leg">
          <rect x="-4" y="0" width="8" height="18" rx="4" fill="#F2E6DC" />
          <ellipse cx="0" cy="18" rx="6" ry="4" fill="#FFF8F0" />
        </g>
      </g>

      <!-- Cat Main Body -->
      <ellipse cx="0" cy="-10" rx="24" ry="20" fill="#FFF8F0" />
      <!-- Orange Calico Patch on Body -->
      <path d="M -12 -22 Q 4 -28 10 -15 Q 12 0 -2 -2 Q -16 -4 -12 -22 Z" fill="#E8834A" opacity="0.9" />

      <!-- Front Legs (Foreground) -->
      <g transform="translate(-6, 12)">
        <g class="front-leg">
          <rect x="-4" y="0" width="9" height="18" rx="4.5" fill="#FFF8F0" stroke="#F0E0D4" stroke-width="0.5" />
          <ellipse cx="0" cy="18" rx="6.5" ry="4" fill="#FFF8F0" />
        </g>
      </g>
      <g transform="translate(14, 12)">
        <g class="back-leg">
          <rect x="-4" y="0" width="9" height="18" rx="4.5" fill="#FFF8F0" stroke="#F0E0D4" stroke-width="0.5" />
          <ellipse cx="0" cy="18" rx="6.5" ry="4" fill="#FFF8F0" />
        </g>
      </g>

      <!-- Head Container -->
      <g transform="translate(12, -26)">

        <!-- Ears with Twitch -->
        <g class="cat-ears">
          <!-- Left Ear -->
          <polygon points="-16,-14 -24,-34 -6,-24" fill="#FFF8F0" />
          <polygon points="-15,-16 -21,-30 -8,-23" fill="#FFB0C8" />
          <!-- Right Ear (with orange patch) -->
          <polygon points="4,-24 18,-34 14,-14" fill="#E8834A" />
          <polygon points="6,-23 15,-30 13,-16" fill="#FFB0C8" />
        </g>

        <!-- Big Cute Head -->
        <circle cx="0" cy="-8" r="23" fill="#FFF8F0" />
        <!-- Orange Patch on right cheek/forehead -->
        <path d="M 2 -26 Q 18 -26 22 -10 Q 18 4 6 -4 Z" fill="#E8834A" opacity="0.95" />

        <!-- Rosy Blush -->
        <ellipse cx="-13" cy="1" rx="6" ry="3.5" fill="#FFAAA6" opacity="0.45" />
        <ellipse cx="13" cy="1" rx="6" ry="3.5" fill="#FFAAA6" opacity="0.45" />

        <!-- Big Expressive Feline Eyes with Blinking -->
        <g class="cat-eye" transform="translate(-8, -8)">
          <ellipse cx="0" cy="0" rx="6.5" ry="7.5" fill="#FFFFFF" />
          <ellipse cx="0.5" cy="0" rx="5" ry="6" fill="#4A9FE8" />
          <ellipse cx="0.5" cy="0" rx="2" ry="5" fill="#1A2A3A" />
          <!-- Eye Catchlights -->
          <circle cx="-1.5" cy="-2.5" r="1.8" fill="#FFFFFF" />
          <circle cx="2" cy="1.5" r="0.9" fill="#FFFFFF" />
        </g>

        <g class="cat-eye" transform="translate(8, -8)">
          <ellipse cx="0" cy="0" rx="6.5" ry="7.5" fill="#FFFFFF" />
          <ellipse cx="0.5" cy="0" rx="5" ry="6" fill="#4A9FE8" />
          <ellipse cx="0.5" cy="0" rx="2" ry="5" fill="#1A2A3A" />
          <!-- Eye Catchlights -->
          <circle cx="-1.5" cy="-2.5" r="1.8" fill="#FFFFFF" />
          <circle cx="2" cy="1.5" r="0.9" fill="#FFFFFF" />
        </g>

        <!-- Tiny Cute Nose & Mouth -->
        <polygon points="0,-1 -3,-4 3,-4" fill="#FF9999" />
        <path d="M -3 1 Q 0 4 3 1" fill="none" stroke="#CC7777" stroke-width="1.2" stroke-linecap="round" />

        <!-- Fine Whiskers -->
        <line x1="-8" y1="-1" x2="-26" y2="-4" stroke="#FFF" stroke-width="1.2" opacity="0.9" />
        <line x1="-8" y1="1" x2="-28" y2="2" stroke="#FFF" stroke-width="1.2" opacity="0.9" />
        <line x1="-8" y1="3" x2="-25" y2="8" stroke="#FFF" stroke-width="1.2" opacity="0.9" />

        <line x1="8" y1="-1" x2="26" y2="-4" stroke="#FFF" stroke-width="1.2" opacity="0.9" />
        <line x1="8" y1="1" x2="28" y2="2" stroke="#FFF" stroke-width="1.2" opacity="0.9" />
        <line x1="8" y1="3" x2="25" y2="8" stroke="#FFF" stroke-width="1.2" opacity="0.9" />

        <!-- Cute Accessory: Bell Collar -->
        <path d="M -16 11 Q 0 17 16 11" fill="none" stroke="#E83030" stroke-width="3" stroke-linecap="round" />
        <circle cx="0" cy="15" r="3.5" fill="#FFD700" stroke="#CC9900" stroke-width="0.8" />
      </g>
    </g>
  </g>
</svg>
